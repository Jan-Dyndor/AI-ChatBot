services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    env_file:
      - .env.docker
    ports:
      - "8001:8001"
    restart: unless-stopped 
    volumes:
      - uploaded_files:/app_backend/storage
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"


  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    env_file:
      - .env.docker
    ports:
      - "8501:8501"
    restart: unless-stopped 

  postgres:
    image: postgres:18
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped 
    ports:
      - "5433:5432"

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/data
    env_file:
      - .env.docker
    ports:
      - "8000:8000"





volumes:
  postgres_data:
  uploaded_files:
  chroma_data:

