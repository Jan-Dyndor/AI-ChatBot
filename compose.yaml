services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    restart: unless-stopped 
    volumes:
      - uploaded_files:/app_backend/storage
      - chroma_db:/app_backend/vector_storage
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"


  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    env_file:
      - .env.docker
    ports:
      - "8501:8501"
    restart: unless-stopped 

  postgres:
    image: postgres:18
    env_file:
      - .env.docker
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped 




volumes:
  postgres_data:
  uploaded_files:
  chroma_db:

